<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cricket Live</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar navbar-dark cricket-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            🏏 Cricket Live
        </a>

        <a
            href="login.html"
            class="btn btn-outline-light btn-sm"
        >
            Admin Login
        </a>

    </div>

</nav>


<main class="container py-4">


    <!-- TOURNAMENT HEADER -->

    <section class="tournament-header mb-4">

        <div class="tournament-icon">
            🏆
        </div>

        <div>

            <h1 id="tournamentName">
                Ganesh Premier League
            </h1>

            <p class="mb-0">
                Local Cricket Tournament
            </p>

        </div>

    </section>


    <!-- LIVE MATCH -->

    <section class="mb-4">

        <div class="section-title">

            <h4>
                <span class="live-dot"></span>
                Live Match
            </h4>

        </div>


        <div class="card live-card">

            <div class="card-body text-center">

                <span class="badge bg-danger mb-3">
                    LIVE
                </span>


                <div class="row align-items-center">

                    <div class="col-5">

                        <div class="team-icon">
                            🏏
                        </div>

                        <h5>
                            Team A
                        </h5>

                        <h3>
                            105/4
                        </h3>

                        <small>
                            9.2 Overs
                        </small>

                    </div>


                    <div class="col-2">

                        <strong>
                            VS
                        </strong>

                    </div>


                    <div class="col-5">

                        <div class="team-icon">
                            🏏
                        </div>

                        <h5>
                            Team B
                        </h5>

                        <h3>
                            62/3
                        </h3>

                        <small>
                            7.1 Overs
                        </small>

                    </div>

                </div>


                <a
                    href="live-score.html"
                    class="btn btn-primary w-100 mt-4"
                >
                    View Live Score
                </a>

            </div>

        </div>

    </section>


    <!-- UPCOMING -->

    <section class="mb-4">

        <div class="section-title">

            <h4>
                Upcoming Matches
            </h4>

        </div>


        <div class="card">

            <div class="card-body">

                <span class="badge bg-secondary">
                    MATCH 02
                </span>

                <div class="text-center py-3">

                    <h5>
                        Team A
                    </h5>

                    <div class="text-muted">
                        VS
                    </div>

                    <h5>
                        Team B
                    </h5>

                    <p class="text-muted mb-0">
                        Today • 7:00 PM
                    </p>

                </div>

            </div>

        </div>

    </section>


    <!-- QUICK MENU -->

    <div class="row g-3">

        <div class="col-6">

            <a
                href="teams.html"
                class="quick-card"
            >

                <i class="bi bi-people-fill"></i>

                <span>
                    Teams
                </span>

            </a>

        </div>


        <div class="col-6">

            <a
                href="matches.html"
                class="quick-card"
            >

                <i class="bi bi-calendar-event"></i>

                <span>
                    Matches
                </span>

            </a>

        </div>


        <div class="col-6">

            <a
                href="points-table.html"
                class="quick-card"
            >

                <i class="bi bi-trophy-fill"></i>

                <span>
                    Points Table
                </span>

            </a>

        </div>


        <div class="col-6">

            <a
                href="players.html"
                class="quick-card"
            >

                <i class="bi bi-person-fill"></i>

                <span>
                    Players
                </span>

            </a>

        </div>

    </div>


</main>


<nav class="mobile-bottom-nav">

    <a href="index.html" class="active">
        <i class="bi bi-house-fill"></i>
        <span>Home</span>
    </a>

    <a href="matches.html">
        <i class="bi bi-calendar-event"></i>
        <span>Matches</span>
    </a>

    <a href="teams.html">
        <i class="bi bi-people"></i>
        <span>Teams</span>
    </a>

    <a href="points-table.html">
        <i class="bi bi-trophy"></i>
        <span>Points</span>
    </a>

</nav>


</body>
</html>
